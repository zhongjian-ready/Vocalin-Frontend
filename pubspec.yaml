name: vocalin
description: Vocalin - A shared space for loved ones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  uuid: ^3.0.7
  dio: ^5.9.0
  flutter_dotenv: ^5.2.1
  flutter_staggered_grid_view: ^0.7.0
  share_plus: ^13.1.0
  image_picker: ^1.1.2
  super_editor: ^0.2.7
  # In a real app, you would add http or dio for backend communication
  # http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
